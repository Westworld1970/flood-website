name: gitleaks

# Secret scan on every push and pull request (task #1418, CONTROLS G9c).
#
# Scans the commits being pushed, or the commits a pull request adds — not the
# whole history — so the job fails only on a secret that is NEW. What was
# already in history was scanned once on 2 Oct 2026 and is handled by rotating
# the credential, not by this job.
#
# The gitleaks binary is downloaded at a fixed version and checked against its
# published SHA-256 before it runs. No third-party action is involved.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${BASE_SHA}..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..HEAD"
          elif git rev-parse --verify -q "origin/${DEFAULT_BRANCH}" >/dev/null \
            && [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
            # A new branch, or a force-push whose old tip is gone: scan everything
            # that is not already on the default branch.
            RANGE="origin/${DEFAULT_BRANCH}..HEAD"
          fi
          if [ -n "$RANGE" ]; then
            echo "Scanning commits in ${RANGE}"
            gitleaks git --redact --no-banner --log-opts="${RANGE}" .
          else
            echo "No base to compare against: scanning the tip commit"
            gitleaks git --redact --no-banner --log-opts="-1" .
          fi
